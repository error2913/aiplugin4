name: Build Check

on:
  push:
    branches: [main, 'refactor/**']
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check (strict)
        run: npx tsc --noEmit --strict

      - name: Build and validate package
        run: npm run package:check

      - name: Smoke test
        run: npm run smoke

      - name: Backend launcher check (Linux)
        run: |
          python3 backends/launcher.py list
          python3 backends/launcher.py package

      - name: Check status
        if: failure()
        run: |
          echo "Check failed. Please check the errors above."
          exit 1
