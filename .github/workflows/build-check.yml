name: Build Check

on:
  push:
    branches: [main, 'refactor/**']
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # 必须直跑 tsconfig（npx tsc --noEmit），不要加 --strict：
      # 命令行 --strict 会覆盖 tsconfig 的严格选项，实测会把「联合类型未收窄」
      # （Property 'error' does not exist）这类错误静默吞掉 ——
      # 同一份代码 tsconfig 直跑 exit=2，换成 `--strict` 后 exit=0，类型门禁形同失效。
      # tsconfig 已启用 noImplicitReturns / noUnusedLocals 等；如需更严，请改 tsconfig 而非命令行覆盖。
      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test:unit

      - name: Build and validate package
        run: npm run package:check

      - name: Smoke test
        run: npm run smoke

      - name: Check status
        if: failure()
        run: |
          echo "Check failed. Please check the errors above."
          exit 1
