name: Build and Release

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aiplugin4-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  SEALPACK_SERVER: https://repo.sealdice.com/

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check (strict)
        run: npx tsc --noEmit --strict

      - name: Build and validate package
        run: npm run package:check

      - name: Smoke test
        run: npm run smoke

      - name: Verify tag, version and changelog
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(node scripts/prepare-sealpack.js)"
          test "${GITHUB_REF_NAME}" = "v${version}"
          node scripts/release-notes.js "${version}" > /dev/null

      - name: Pack SealRepo artifact
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          node scripts/build-release.js

      - name: Upload build artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ github.run_id }}
          if-no-files-found: error
          path: |
            dist/*.sealpack
            dist/aiplugin4.js
            sealpack/**

  publish-sealrepo:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download verified package
        uses: actions/download-artifact@v4
        with:
          name: release-assets-${{ github.run_id }}

      - name: Prepare release packages
        run: node scripts/build-release.js

      - name: Publish to SealRepo
        env:
          SEALPACK_TOKEN: ${{ secrets.SEALPACK_TOKEN }}
        run: >-
          npx sealpack publish sealpack
          --create
          --server "${SEALPACK_SERVER}"

      - name: Publish full bundle to SealRepo
        env:
          SEALPACK_TOKEN: ${{ secrets.SEALPACK_TOKEN }}
        run: >-
          npx sealpack publish sealpack-full
          --create
          --server "${SEALPACK_SERVER}"

  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: publish-sealrepo
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download verified artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-assets-${{ github.run_id }}

      - name: Generate release notes from update.ts
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/release-notes.js "${version}" > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/aiplugin4-*.sealpack
            dist/aiplugin4.js
          body_path: release-notes.md
          fail_on_unmatched_files: true
